<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src *; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <title>NEXUS Research Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="Research navigation">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="12" cy="12" r="2.6" />
              <circle cx="5" cy="6" r="1.8" />
              <circle cx="19" cy="6" r="1.8" />
              <circle cx="5" cy="18" r="1.8" />
              <circle cx="19" cy="18" r="1.8" />
              <path d="M6.5 7.2l3.6 3.3M17.5 7.2l-3.6 3.3M6.5 16.8l3.6-3.3M17.5 16.8l-3.6-3.3" />
            </svg>
          </div>
          <div>
            <div class="brand-name">NEXUS</div>
            <div class="brand-sub">Research Agent</div>
          </div>
        </div>
        <div class="breadcrumb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" />
          </svg>
          <span>deep_agent<span id="breadcrumb-thread"></span></span>
        </div>

        <nav class="nav">
          <div id="orchestrator-slot"></div>
          <div class="nav-label">
            <span>Research team</span>
            <span id="analyst-count" class="nav-tag" hidden></span>
          </div>
          <p id="analyst-empty" class="nav-empty">Analysts appear here once you approve the panel.</p>
          <div id="analyst-list" class="analyst-list"></div>
        </nav>

        <div id="connection" class="connection tone-muted">Connecting…</div>
      </aside>

      <main id="main" class="main">
        <div id="demo-banner" class="demo-banner" hidden>
          Demo replay of a recorded stub-server session. All content is placeholder data and no API calls are made.
        </div>
      </main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
