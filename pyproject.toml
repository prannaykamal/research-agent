[project]
name = "langgraph-assistant"
version = "0.1.0"
description = "Bounded adaptive map-reduce research assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.1.3",
    "beautifulsoup4>=4.12.3",
    "colorama>=0.4.6",
    "dotenv>=0.9.9",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.0.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-cli[inemem,inmem]>=0.4.31",
    "wikipedia>=1.4.0",
    "xmltodict>=0.14.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
